
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes | Logic Gates</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #10234a, #050816 70%);
    color: white;
}

.banner {
    position: relative;
    width: 100%;
    min-height: 280px;
    padding: 45px 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
    border-top: 2px solid #00eaff;
    border-bottom: 2px solid #a855f7;
}

.banner::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(#00eaff12 1px, transparent 1px),
        linear-gradient(90deg, #00eaff12 1px, transparent 1px);
    background-size: 35px 35px;
    animation: gridMove 8s linear infinite;
}

h1 {
    position: relative;
    z-index: 1;
    margin: 0;
    font-size: clamp(38px, 8vw, 76px);
    font-weight: 900;
    letter-spacing: 6px;
    background: linear-gradient(
        90deg, #00eaff, #ffffff, #a855f7, #00eaff
    );
    background-size: 300%;
    color: transparent;
    background-clip: text;
    -webkit-background-clip: text;
    animation: glowText 5s linear infinite;
    text-shadow: 0 0 25px #00eaff45;
}

.subtitle {
    position: relative;
    z-index: 1;
    margin-top: 20px;
    color: #b7c9ff;
    font-size: clamp(12px, 2.5vw, 17px);
    letter-spacing: 4px;
}

.line {
    position: relative;
    z-index: 1;
    width: 140px;
    height: 3px;
    margin-top: 22px;
    background: linear-gradient(90deg, #00eaff, #a855f7);
    box-shadow: 0 0 15px #00eaff;
    animation: linePulse 2s ease-in-out infinite alternate;
}

@keyframes glowText {
    from { background-position: 0%; }
    to { background-position: 300%; }
}

@keyframes gridMove {
    from { transform: translateY(0); }
    to { transform: translateY(35px); }
}

@keyframes linePulse {
    from { opacity: 0.5; width: 100px; }
    to { opacity: 1; width: 180px; }
}
</style>
</head>

<body>
    <div class="banner">
        <h1>STUDY NOTES</h1>
        <div class="subtitle">
            LEARN • UNDERSTAND • MASTER
        </div>
        <div class="line"></div>
    </div>
</body>
</html>
